<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CyberChat Auto-Sync Vault</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none !important; -webkit-user-select: none !important; -webkit-user-drag: none !important; }
        html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #02040a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .app-container { width: 100vw; height: 100vh; height: 100dvh; background: radial-gradient(circle at top right, #050b18, #02040a); display: flex; flex-direction: column; overflow: hidden; position: relative; }

        @keyframes fluidPop { 0% { opacity: 0; transform: scale(0.85) translateY(20px); filter: blur(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0px); } }
        @keyframes backdropFade { 0% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes unlockFadeOut { 0% { opacity: 1; transform: scale(1); filter: blur(20px); } 100% { opacity: 0; transform: scale(1.15); filter: blur(40px); } }
        @keyframes msgSlideIn { 0% { opacity: 0; transform: translateY(18px) scale(0.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes pulseAudio { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.8; } }

        .typing-container {
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #00f2fe;
            font-weight: 700;
            padding: 4px 20px;
            height: 26px;
        }

        .typing-dots-box {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 12px;
            border-radius: 14px;
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background-color: #00f2fe;
            border-radius: 50%;
            display: inline-block;
            animation: dotBounce 1.2s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        .typing-dot:nth-child(3) { animation-delay: 0s; }

        #paywallOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 4, 10, 0.96); backdrop-filter: blur(30px); z-index: 999999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; animation: backdropFade 0.4s ease; }
        #paywallOverlay.unlock-exit { animation: unlockFadeOut 0.45s ease forwards; pointer-events: none; }
        .paywall-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(0, 242, 254, 0.4); border-radius: 24px; padding: 36px 26px; width: 100%; max-width: 320px; text-align: center; animation: fluidPop 0.5s ease; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9); }
        .paywall-title { color: #ffffff; font-size: 20px; font-weight: 800; margin-bottom: 6px; background: linear-gradient(135deg, #ffffff 0%, #00f2fe 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .paywall-desc { color: #64748b; font-size: 12px; margin-bottom: 24px; letter-spacing: 0.5px; }
        .pass-input { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 14px; padding: 13px; color: #ffffff; text-align: center; outline: none; font-size: 15px; margin-bottom: 14px; transition: all 0.3s ease; user-select: text !important; -webkit-user-select: text !important; }
        .pass-input:focus { border-color: #00f2fe; box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); background: rgba(255, 255, 255, 0.08); }
        .btn-unlock { background: linear-gradient(135deg, #00f2fe 0%, #0066ff 100%); border: none; color: #ffffff; padding: 13px; border-radius: 14px; font-size: 13px; font-weight: 800; cursor: pointer; width: 100%; transition: transform 0.2s ease, box-shadow 0.2s ease; box-shadow: 0 6px 20px rgba(0, 242, 254, 0.3); letter-spacing: 1px; }
        .btn-unlock:active { transform: scale(0.95); }
        .error-msg { color: #ff4757; font-size: 12px; margin-top: 14px; display: none; animation: fluidPop 0.3s ease; font-weight: 600; }

        .app-header { padding: 12px 16px; background: rgba(255, 255, 255, 0.02); border-bottom: 1px solid rgba(255, 255, 255, 0.06); display: flex; align-items: center; justify-content: space-between; }
        .header-info h4 { color: #ffffff; font-size: 16px; font-weight: 800; }
        .header-info span { color: #00f2fe; font-size: 11px; font-weight: 700; }
        
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .icon-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px; cursor: pointer; transition: all 0.2s ease; }
        .icon-btn svg { width: 18px; height: 18px; fill: currentColor; }
        .icon-btn:active { transform: scale(0.9); background: rgba(0, 242, 254, 0.2); }
        .icon-btn.active-timer { border-color: #00f2fe; color: #00f2fe; background: rgba(0, 242, 254, 0.15); box-shadow: 0 0 10px rgba(0, 242, 254, 0.3); }

        .btn-disabled { opacity: 0.35 !important; cursor: not-allowed !important; pointer-events: none !important; filter: grayscale(100%); }

        .connect-drawer { background: rgba(0, 0, 0, 0.3); padding: 10px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; gap: 8px; }
        .id-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 8px 12px; border-radius: 12px; color: #94a3b8; font-size: 12px; }
        .id-bar b { color: #00f2fe; font-family: monospace; font-size: 13px; }
        .btn-copy { background: linear-gradient(135deg, #00f2fe, #0066ff); border: none; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
        .btn-copy:active { transform: scale(0.9); }
        .input-bar { display: flex; gap: 8px; }
        .input-bar input { flex: 1; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 8px 12px; color: white; outline: none; font-size: 12px; user-select: text !important; -webkit-user-select: text !important; }
        .btn-connect { background: linear-gradient(135deg, #7b2cbf, #ff007f); color: white; border: none; padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; }
        .btn-connect:active { transform: scale(0.92); }
        .status-text { font-size: 11px; color: #8a99ad; text-align: center; font-weight: 600; }

        .chat-area { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .msg { max-width: 78%; padding: 10px 14px; border-radius: 18px; font-size: 14.5px; line-height: 1.4; word-wrap: break-word; animation: msgSlideIn 0.35s ease; user-select: text !important; -webkit-user-select: text !important; }
        .my-msg { align-self: flex-end; background: linear-gradient(135deg, #0088ff, #0055ff); color: #ffffff; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(0, 136, 255, 0.25); }
        .other-msg { align-self: flex-start; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.08); color: #ffffff; border-bottom-left-radius: 4px; }
        .msg-image-wrapper { padding: 0 !important; background: transparent !important; border: none !important; }
        .normal-chat-img { max-width: 230px; max-height: 280px; border-radius: 16px; display: block; object-fit: cover; cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.15); }

        .view-once-pill { display: inline-flex; align-items: center; gap: 8px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(0, 242, 254, 0.5); padding: 9px 16px; border-radius: 22px; color: #ffffff !important; font-size: 13px; font-weight: 700; cursor: pointer; }
        .view-once-pill.opened { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.15); color: #8a99ad !important; cursor: default; }
        .view-once-badge { width: 18px; height: 18px; border-radius: 50%; border: 2px dashed #00f2fe; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: #00f2fe; }

        #mediaViewerOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000000; z-index: 9999999; display: none; flex-direction: column; justify-content: center; align-items: center; }
        #fullscreenImg { max-width: 92%; max-height: 75vh; border-radius: 12px; object-fit: contain; animation: fluidPop 0.3s ease; pointer-events: none; }
        .btn-close-media { position: absolute; top: 25px; right: 20px; background: rgba(255, 255, 255, 0.2); color: white; border: none; padding: 9px 20px; border-radius: 22px; font-size: 13px; font-weight: 700; cursor: pointer; }
        .timer-badge { position: absolute; top: 25px; left: 20px; color: #ff4757; font-size: 16px; font-weight: 900; background: rgba(255,71,87,0.15); border: 1px solid #ff4757; padding: 6px 14px; border-radius: 20px; }

        /* PIP VIDEO & CALL OVERLAY */
        #videoContainer { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: #02040a; z-index: 999999; display: none; flex-direction: column; 
            justify-content: center; align-items: center; overflow: hidden;
        }
        #remoteVideo { 
            width: 100%; height: 100%; object-fit: cover; background: #000; 
        }

        .audio-call-placeholder {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: #00f2fe;
            z-index: 999999;
        }
        .audio-outline-box {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px dashed #00f2fe;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulseAudio 2s infinite ease-in-out;
            background: rgba(0, 242, 254, 0.05);
        }
        .audio-outline-box svg {
            width: 44px;
            height: 44px;
            fill: none;
            stroke: #00f2fe;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .audio-call-title {
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* LOCAL VIDEO - MIRRORING RESTORED FOR NATURAL STRAIGHT FACE LOOK */
        #localVideo {
            position: absolute; bottom: 90px; right: 20px; width: 110px; height: 160px;
            object-fit: cover; border-radius: 16px; border: 2px solid rgba(255,255,255,0.4);
            transform: scaleX(-1);
            z-index: 1000000; background: #111; box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        .call-controls-bar {
            position: absolute; bottom: 25px; left: 0; width: 100%;
            display: flex; justify-content: center; gap: 20px; z-index: 1000001;
        }
        .btn-end-video { 
            background: #ff3b30; color: white; border: none; padding: 14px 34px; 
            border-radius: 30px; font-weight: 800; font-size: 15px; cursor: pointer; 
            box-shadow: 0 4px 20px rgba(255, 59, 48, 0.4);
        }

        #incomingCallModal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(2, 4, 10, 0.92); backdrop-filter: blur(20px);
            z-index: 9999999; display: none; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px;
            animation: fluidPop 0.3s ease;
        }
        .modal-call-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 28px; padding: 32px 24px; text-align: center; width: 100%; max-width: 300px;
        }
        .modal-call-card h3 { color: #ffffff; font-size: 18px; margin-bottom: 6px; }
        .modal-call-card p { color: #00f2fe; font-size: 13px; font-weight: 700; margin-bottom: 24px; }
        .call-btn-group { display: flex; justify-content: center; gap: 16px; }
        .btn-call-act { padding: 12px 24px; border-radius: 22px; border: none; font-weight: 800; font-size: 14px; cursor: pointer; }
        .btn-call-accept { background: #34c759; color: white; box-shadow: 0 4px 15px rgba(52, 199, 89, 0.4); }
        .btn-call-decline { background: #ff3b30; color: white; box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4); }

        #sendOptionModal, #timerModal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); z-index: 999999; display: none; justify-content: center; align-items: center; padding: 20px; }
        .option-card { background: #090e1a; border: 1px solid rgba(0, 242, 254, 0.3); border-radius: 24px; padding: 26px; width: 100%; max-width: 300px; text-align: center; animation: fluidPop 0.3s ease; }
        .option-card h3 { color: #fff; font-size: 17px; margin-bottom: 18px; }
        .btn-option { width: 100%; padding: 13px; border-radius: 14px; border: none; font-size: 14px; font-weight: 700; margin-bottom: 10px; cursor: pointer; }
        .btn-viewonce { background: linear-gradient(135deg, #00f2fe, #0066ff); color: white; }
        .btn-normal { background: rgba(255, 255, 255, 0.08); color: white; border: 1px solid rgba(255,255,255,0.15); }
        .btn-cancel { background: transparent; color: #ff4757; margin-bottom: 0; font-size: 13px; }

        .timer-opt-btn { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; font-weight: 700; margin-bottom: 8px; font-size: 13px; cursor: pointer; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        .timer-opt-btn.active { border-color: #00f2fe; color: #00f2fe; background: rgba(0,242,254,0.1); }

        .bottom-nav { padding: 12px 16px; background: rgba(255, 255, 255, 0.02); border-top: 1px solid rgba(255, 255, 255, 0.06); display: flex; align-items: center; gap: 10px; }
        .input-pill { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1.5px solid rgba(255, 255, 255, 0.1); border-radius: 25px; padding: 8px 16px; display: flex; align-items: center; gap: 10px; }
        .input-pill input[type="text"] { flex: 1; background: none; border: none; color: #ffffff; outline: none; font-size: 14px; user-select: text !important; -webkit-user-select: text !important; }
        
        .file-label-btn { background: none; border: none; color: #8a99ad; display: flex; align-items: center; cursor: pointer; padding: 4px; }
        .file-label-btn svg { width: 22px; height: 22px; fill: currentColor; }
        
        .btn-send { color: #00f2fe; font-weight: 800; font-size: 15px; border: none; background: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container" id="mainContainer">
        <audio id="remoteAudio" autoplay></audio>

        <div id="videoContainer">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
            
            <div class="audio-call-placeholder" id="audioCallUI">
                <div class="audio-outline-box">
                    <svg viewBox="0 0 24 24">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                    </svg>
                </div>
                <div class="audio-call-title" id="audioCallStatusTxt">Voice Call Active</div>
            </div>

            <div class="call-controls-bar">
                <button class="btn-end-video" onclick="endCurrentCall()">End Call</button>
            </div>
        </div>

        <div id="incomingCallModal">
            <div class="modal-call-card">
                <h3>Incoming Call</h3>
                <p id="incomingCallSubtext">Partner is calling...</p>
                <div class="call-btn-group">
                    <button class="btn-call-act btn-call-decline" onclick="declineIncomingCall()">Decline</button>
                    <button class="btn-call-act btn-call-accept" onclick="acceptIncomingCall()">Accept</button>
                </div>
            </div>
        </div>

        <div id="paywallOverlay">
            <div class="paywall-card">
                <h3 class="paywall-title">Zero-Vault Chat</h3>
                <p class="paywall-desc">Encrypted Trust </p>
                <input type="password" id="accessPassInput" class="pass-input" placeholder="Enter Access Key">
                <button type="button" class="btn-unlock" onclick="doUnlock()">UNLOCK</button>
                <div id="errTxt" class="error-msg">Invalid Authentication Key</div>
            </div>
        </div>

        <div id="sendOptionModal">
            <div class="option-card">
                <h3>Select Photo Security</h3>
                <button class="btn-option btn-viewonce" onclick="processSelectedFile(true)">View Once (5s Purge)</button>
                <button class="btn-option btn-normal" onclick="processSelectedFile(false)">Image Encrypted</button>
                <button class="btn-option btn-cancel" onclick="cancelFileSelection()">Cancel</button>
            </div>
        </div>

        <div id="timerModal">
            <div class="option-card">
                <h3>Self-Destruct Messages</h3>
                <button class="timer-opt-btn active" id="t-0" onclick="setMsgTimer(0, 'Off')">Off <span>✓</span></button>
                <button class="timer-opt-btn" id="t-5000" onclick="setMsgTimer(5000, '5s')">5 Seconds</button>
                <button class="timer-opt-btn" id="t-10000" onclick="setMsgTimer(10000, '10s')">10 Seconds</button>
                <button class="timer-opt-btn" id="t-30000" onclick="setMsgTimer(30000, '30s')">30 Seconds</button>
                <button class="btn-option btn-cancel" style="margin-top: 10px;" onclick="closeTimerModal()">Close</button>
            </div>
        </div>

        <div id="mediaViewerOverlay">
            <div class="timer-badge" id="timerBadge" style="display:none;">Self-Destruct in: <span id="secCount">5</span>s</div>
            <button class="btn-close-media" onclick="closeMediaViewer()">Purge & Close</button>
            <img id="fullscreenImg" src="" alt="Secure Payload">
        </div>

        <div class="app-header">
            <div class="header-info">
                <h4 id="partnerNameTitle">Vault-Chat</h4>
                <span id="roleTag">Locked Session</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="timerIconBtn" onclick="openTimerModal()">
                    <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                </button>
                
                <button class="icon-btn btn-disabled" id="btnAudioCall" onclick="initiateCall(false)">
                    <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 0 0 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                </button>
                
                <button class="icon-btn btn-disabled" id="btnVideoCall" onclick="initiateCall(true)">
                    <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4zM15 16H5V8h10v8z"/></svg>
                </button>
            </div>
        </div>

        <div class="connect-drawer">
            <div class="id-bar">
                <span>Your ID: <b id="my-id">Offline</b></span>
                <button class="btn-copy" id="copyBtn" onclick="copyMyCode()">Copy Code</button>
            </div>
            <div class="input-bar">
                <input type="text" id="other-id-input" placeholder="Partner ID auto/manual...">
                <button class="btn-connect" onclick="connectToPartner()">Connect</button>
            </div>
            <div class="status-text" id="status">Authenticate session first</div>
        </div>

        <div class="chat-area" id="chatBox"></div>

        <div class="typing-container" id="typingContainer">
            <span id="typingName">Partner</span>
            <div class="typing-dots-box">
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="input-pill">
                <label for="hiddenFileInput" class="file-label-btn btn-disabled" id="fileAttachBtn">
                    <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5V6H9v9.5a3 3 0 0 0 6 0V5a4 4 0 0 0-8 0v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
                </label>
                <input type="file" id="hiddenFileInput" accept="image/*" style="display:none;" onchange="openSendModal(this)" disabled>
                <input type="text" id="userInput" placeholder="Type message..." onkeypress="if(event.key==='Enter') sendTextMessage()" oninput="notifyTyping()">
            </div>
            <button class="btn-send" onclick="sendTextMessage()">Send</button>
        </div>
    </div>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => { if (e.target.tagName !== 'INPUT') e.preventDefault(); });

        window.addEventListener('beforeunload', () => {
            if (conn) conn.close();
            if (peer) peer.destroy();
        });

        function nativeFastHash(str) {
            let hash = 0x811c9dc5;
            for (let i = 0; i < str.length; i++) {
                hash ^= str.charCodeAt(i);
                hash += (hash << 1) + (hash << 4) + (hash << 7) + (hash << 8) + (hash << 24);
            }
            return "HASH_" + (hash >>> 0).toString(16);
        }

        const vVault = {
            [nativeFastHash("PASS_NOMII")]: { name: "NOMII", room: "ROOM1", role: "A" },
            [nativeFastHash("PASS_RIN")]: { name: "RIN", room: "ROOM1", role: "B" },
        };

        let myName = "", partnerName = "Partner", myRole = "", roomCode = "", expectedPartnerId = "", peer = null, conn = null;
        let activeViewOncePill = null, activeIsViewOnceMode = false, selectedFileHolder = null;
        let viewOnceTimer = null;
        let pendingMessageQueue = [];
        let autoPurgeTimerMs = 0;
        
        let activeCall = null;
        let pendingIncomingCall = null;
        let localMediaStream = null;

        function setFeaturesEnabled(enabled) {
            const btnAudio = document.getElementById('btnAudioCall');
            const btnVideo = document.getElementById('btnVideoCall');
            const fileAttach = document.getElementById('fileAttachBtn');
            const hiddenFileInput = document.getElementById('hiddenFileInput');

            if (enabled) {
                btnAudio.classList.remove('btn-disabled');
                btnVideo.classList.remove('btn-disabled');
                fileAttach.classList.remove('btn-disabled');
                hiddenFileInput.removeAttribute('disabled');
            } else {
                btnAudio.classList.add('btn-disabled');
                btnVideo.classList.add('btn-disabled');
                fileAttach.classList.add('btn-disabled');
                hiddenFileInput.setAttribute('disabled', 'true');
            }
        }

        function doUnlock() {
            const userVal = document.getElementById('accessPassInput').value.trim();
            if (!userVal) return;

            const userHash = nativeFastHash(userVal);

            if (!vVault[userHash]) {
                document.getElementById('errTxt').style.display = 'block';
                return;
            }

            document.getElementById('errTxt').style.display = 'none';
            const config = vVault[userHash];
            myName = config.name; myRole = config.role; roomCode = config.room;

            const myPeerId = "CC_" + roomCode + "_" + myRole;
            expectedPartnerId = "CC_" + roomCode + "_" + ((myRole === "A") ? "B" : "A");

            document.getElementById('roleTag').innerText = myName + " 🛡️ ONLINE";
            const overlay = document.getElementById('paywallOverlay');
            overlay.classList.add('unlock-exit');
            setTimeout(() => { overlay.style.display = 'none'; initPeerConnection(myPeerId); }, 400);
        }

        function initPeerConnection(customId) {
            updateStatus("Initializing Peer Engine...", "#e67e22");
            peer = new Peer(customId, { host: '0.peerjs.com', port: 443, path: '/', secure: true });
            
            peer.on('open', id => {
                document.getElementById('my-id').innerText = id;
                document.getElementById('other-id-input').value = expectedPartnerId;
                updateStatus("Online! Press Connect", "#00f2fe");
                setTimeout(connectToPartner, 1000);
            });

            peer.on('connection', incomingConn => {
                conn = incomingConn;
                setupEvents();
            });

            peer.on('call', call => {
                pendingIncomingCall = call;
                const isVideoCall = call.metadata && call.metadata.isVideo;
                document.getElementById('incomingCallSubtext').innerText = partnerName + (isVideoCall ? " Video Call..." : " Voice Call...");
                document.getElementById('incomingCallModal').style.display = 'flex';
            });

            peer.on('error', err => {
                handlePartnerDisconnect();
            });

            peer.on('disconnected', () => {
                handlePartnerDisconnect();
            });
        }

        function handlePartnerDisconnect() {
            updateStatus("Partner Disconnected / Offline", "#ff4757");
            setFeaturesEnabled(false);
            endCurrentCall();
        }

        function acceptIncomingCall() {
            document.getElementById('incomingCallModal').style.display = 'none';
            if (!pendingIncomingCall) return;

            const isVideoCall = pendingIncomingCall.metadata && pendingIncomingCall.metadata.isVideo;
            
            navigator.mediaDevices.getUserMedia({ 
                audio: true, 
                video: isVideoCall ? { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" } : false 
            })
            .then(stream => {
                localMediaStream = stream;
                if (isVideoCall) {
                    document.getElementById('localVideo').srcObject = stream;
                    document.getElementById('localVideo').style.display = 'block';
                } else {
                    document.getElementById('localVideo').style.display = 'none';
                }
                pendingIncomingCall.answer(stream);
                handleMediaStream(pendingIncomingCall, isVideoCall);
            })
            .catch(err => alert("Media Access Denied: " + err));
        }

        function declineIncomingCall() {
            if (pendingIncomingCall) pendingIncomingCall.close();
            document.getElementById('incomingCallModal').style.display = 'none';
            pendingIncomingCall = null;
        }

        function connectToPartner() {
            const partnerId = document.getElementById('other-id-input').value.trim();
            if (partnerId) { 
                updateStatus("Connecting to Partner...", "#e67e22");
                conn = peer.connect(partnerId, { reliable: true });
                setupEvents();
            }
        }

        function setupEvents() {
            if (!conn) return;

            conn.on('open', () => { 
                updateStatus("Connected & Encrypted Active", "#00f2fe");
                setFeaturesEnabled(true);
                conn.send({ type: 'handshake', name: myName });
                
                while(pendingMessageQueue.length > 0) {
                    const item = pendingMessageQueue.shift();
                    conn.send(item);
                }
            });

            conn.on('data', data => {
                if (!data) return;

                if (data.type === 'handshake') { 
                    partnerName = data.name; 
                    document.getElementById('partnerNameTitle').innerText = partnerName + " 🛡️"; 
                    updateStatus("Connected with " + partnerName, "#00f2fe");
                    setFeaturesEnabled(true);
                }
                else if (data.type === 'text') appendMsg(data.content, 'other-msg');
                else if (data.type === 'file') {
                    if(data.isViewOnce) appendViewOncePill(data, 'other-msg', false);
                    else appendNormalImage(data.fileBuffer, 'other-msg');
                }
                else if (data.type === 'typing') showTyping();
            });

            conn.on('close', () => {
                handlePartnerDisconnect();
            });

            conn.on('error', () => {
                handlePartnerDisconnect();
            });
        }

        function openTimerModal() { document.getElementById('timerModal').style.display = 'flex'; }
        function closeTimerModal() { document.getElementById('timerModal').style.display = 'none'; }
        
        function setMsgTimer(ms, label) {
            autoPurgeTimerMs = ms;
            document.querySelectorAll('.timer-opt-btn').forEach(b => {
                b.classList.remove('active');
                b.querySelector('span')?.remove();
            });
            const selectedBtn = document.getElementById('t-' + ms);
            selectedBtn.classList.add('active');
            selectedBtn.innerHTML += ' <span>✓</span>';
            
            const timerIconBtn = document.getElementById('timerIconBtn');
            if (ms > 0) {
                timerIconBtn.classList.add('active-timer');
            } else {
                timerIconBtn.classList.remove('active-timer');
            }
            closeTimerModal();
        }

        function initiateCall(isVideo) {
            if (!conn || !conn.open) return;
            const partnerId = document.getElementById('other-id-input').value.trim();
            if (!partnerId || !peer) return alert("Partner connection required!");

            navigator.mediaDevices.getUserMedia({ 
                audio: true, 
                video: isVideo ? { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" } : false 
            })
            .then(stream => {
                localMediaStream = stream;
                if (isVideo) {
                    document.getElementById('localVideo').srcObject = stream;
                    document.getElementById('localVideo').style.display = 'block';
                } else {
                    document.getElementById('localVideo').style.display = 'none';
                }
                activeCall = peer.call(partnerId, stream, { metadata: { isVideo: isVideo } });
                handleMediaStream(activeCall, isVideo);
            })
            .catch(err => alert("Camera/Mic Permission Error: " + err));
        }

        function handleMediaStream(call, isVideo) {
            activeCall = call;

            call.on('stream', remoteStream => {
                const videoContainer = document.getElementById('videoContainer');
                const remoteVideo = document.getElementById('remoteVideo');
                const audioCallUI = document.getElementById('audioCallUI');
                const audioStatus = document.getElementById('audioCallStatusTxt');

                videoContainer.style.display = 'flex';

                if (isVideo) {
                    audioCallUI.style.display = 'none';
                    remoteVideo.style.display = 'block';
                    remoteVideo.srcObject = remoteStream;
                } else {
                    remoteVideo.style.display = 'none';
                    audioCallUI.style.display = 'flex';
                    audioStatus.innerText = "Voice Call with " + partnerName;
                    const remoteAudio = document.getElementById('remoteAudio');
                    remoteAudio.srcObject = remoteStream;
                }
                updateStatus("Call Connected 🔒", "#38ef7d");
            });

            call.on('close', () => { endCurrentCall(); });
            call.on('error', () => { endCurrentCall(); });
        }

        function endCurrentCall() {
            if (activeCall) {
                activeCall.close();
                activeCall = null;
            }
            if (localMediaStream) {
                localMediaStream.getTracks().forEach(track => track.stop());
                localMediaStream = null;
            }
            document.getElementById('videoContainer').style.display = 'none';
            document.getElementById('audioCallUI').style.display = 'none';
            document.getElementById('incomingCallModal').style.display = 'none';
            if (conn && conn.open) {
                updateStatus("Connected with " + partnerName, "#00f2fe");
            } else {
                updateStatus("Partner Disconnected / Offline", "#ff4757");
            }
            pendingIncomingCall = null;
        }

        function dispatchPayload(payloadObj) {
            if (conn && conn.open) {
                conn.send(payloadObj);
            } else {
                pendingMessageQueue.push(payloadObj);
                connectToPartner();
            }
        }

        function sendTextMessage() {
            const input = document.getElementById("userInput");
            const txt = input.value.trim();
            if (txt) {
                appendMsg(txt, 'my-msg');
                dispatchPayload({ type: 'text', content: txt });
                input.value = "";
            }
        }

        function openSendModal(input) { 
            if (!conn || !conn.open) return;
            if(input.files && input.files[0]) { 
                selectedFileHolder = input.files[0]; 
                document.getElementById('sendOptionModal').style.display = 'flex'; 
            } 
        }

        function cancelFileSelection() { 
            selectedFileHolder = null; 
            document.getElementById('hiddenFileInput').value = ''; 
            document.getElementById('sendOptionModal').style.display = 'none'; 
        }

        function processSelectedFile(isViewOnce) {
            document.getElementById('sendOptionModal').style.display = 'none';
            if (!selectedFileHolder) return cancelFileSelection();

            const reader = new FileReader();
            reader.onload = function(e) {
                const rawData = { type: 'file', isViewOnce: isViewOnce, fileBuffer: e.target.result };
                dispatchPayload(rawData);
                if(isViewOnce) appendViewOncePill(rawData, 'my-msg', true);
                else appendNormalImage(rawData.fileBuffer, 'my-msg');
                cancelFileSelection();
            };
            reader.readAsDataURL(selectedFileHolder);
        }

        function appendNormalImage(buffer, className) {
            const chatBox = document.getElementById("chatBox"), div = document.createElement("div");
            div.classList.add("msg", className, "msg-image-wrapper");
            const img = document.createElement("img");
            img.src = buffer; img.classList.add("normal-chat-img");
            img.onclick = () => openFullscreenViewer(buffer, false, null);
            div.appendChild(img); chatBox.appendChild(div); chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendViewOncePill(data, className, isSender) {
            const chatBox = document.getElementById("chatBox"), div = document.createElement("div"), pill = document.createElement("div");
            div.classList.add("msg", className); pill.classList.add("view-once-pill");
            if (isSender) {
                pill.classList.add('opened');
                pill.innerHTML = `<span class="view-once-badge">1</span> Photo (View Once Sent)`;
            } else {
                pill.innerHTML = `<span class="view-once-badge">1</span> Photo (Tap to View)`;
                pill.onclick = () => { if (!pill.classList.contains('opened')) openFullscreenViewer(data.fileBuffer, true, pill); };
            }
            div.appendChild(pill); chatBox.appendChild(div); chatBox.scrollTop = chatBox.scrollHeight;
        }

        function openFullscreenViewer(src, isViewOnce, pillEl) {
            activeIsViewOnceMode = isViewOnce; activeViewOncePill = pillEl;
            const viewer = document.getElementById('mediaViewerOverlay'), img = document.getElementById('fullscreenImg'), timerBadge = document.getElementById('timerBadge');
            img.src = src;
            viewer.style.display = 'flex';

            if (isViewOnce) {
                timerBadge.style.display = 'block';
                let left = 5;
                document.getElementById('secCount').innerText = left;
                clearInterval(viewOnceTimer);
                viewOnceTimer = setInterval(() => {
                    left--;
                    document.getElementById('secCount').innerText = left;
                    if(left <= 0) {
                        clearInterval(viewOnceTimer);
                        closeMediaViewer();
                    }
                }, 1000);
            } else {
                timerBadge.style.display = 'none';
            }
        }

        function closeMediaViewer() {
            clearInterval(viewOnceTimer);
            const viewer = document.getElementById('mediaViewerOverlay');
            const img = document.getElementById('fullscreenImg');
            img.src = "";
            viewer.style.display = 'none';

            if (activeIsViewOnceMode && activeViewOncePill) {
                activeViewOncePill.classList.add('opened');
                activeViewOncePill.innerHTML = `<span class="view-once-badge" style="border-color:#8a99ad; color:#8a99ad;">✓</span> Opened & Destroyed`;
                activeViewOncePill.onclick = null;
            }
            activeViewOncePill = null; activeIsViewOnceMode = false;
        }

        function notifyTyping() { dispatchPayload({ type: 'typing' }); }
        
        function showTyping() {
            const container = document.getElementById('typingContainer');
            document.getElementById('typingName').innerText = partnerName;
            container.style.display = 'flex';
            
            const chatBox = document.getElementById("chatBox");
            chatBox.scrollTop = chatBox.scrollHeight;

            clearTimeout(window.typingTimeout);
            window.typingTimeout = setTimeout(() => { 
                container.style.display = 'none'; 
            }, 1800);
        }

        function copyMyCode() {
            navigator.clipboard.writeText(document.getElementById('my-id').innerText);
            document.getElementById('copyBtn').innerText = "Copied!";
            setTimeout(() => { document.getElementById('copyBtn').innerText = "Copy Code"; }, 2000);
        }

        function updateStatus(txt, color) { const st = document.getElementById('status'); if(st) { st.innerText = txt; st.style.color = color; } }
        
        function appendMsg(txt, className) {
            const chatBox = document.getElementById("chatBox"), div = document.createElement("div");
            div.classList.add("msg", className); div.textContent = txt;
            chatBox.appendChild(div); chatBox.scrollTop = chatBox.scrollHeight;

            if (autoPurgeTimerMs > 0) {
                setTimeout(() => {
                    div.style.transition = "opacity 0.3s ease, transform 0.3s ease";
                    div.style.opacity = "0";
                    div.style.transform = "scale(0.8)";
                    setTimeout(() => div.remove(), 300);
                }, autoPurgeTimerMs);
            }
        }
    </script>
</body>
</html>
